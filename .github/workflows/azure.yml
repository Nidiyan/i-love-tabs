name: Test and deploy to Azure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile infrastructure
        run: |
          az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/main.json"
          az bicep build --file infra/app.bicep --outfile "$RUNNER_TEMP/app.json"
      - name: Run tests inside the deployment runtimes
        run: docker build --target test --tag i-love-tabs:test .
      - name: Build and smoke-test production container
        run: |
          set -euo pipefail
          docker build --target production --tag i-love-tabs:smoke .
          docker run --detach --name tabs-smoke --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m --cap-drop ALL \
            --security-opt no-new-privileges --cpus 1 --memory 2g \
            --publish 127.0.0.1:3000:3000 i-love-tabs:smoke
          trap 'docker logs tabs-smoke; docker rm --force tabs-smoke' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused \
            --retry-delay 2 --max-time 10 http://127.0.0.1:3000/ > "$RUNNER_TEMP/home.html"
          grep --quiet 'Guitar video to tablature' "$RUNNER_TEMP/home.html"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: azure-testing
    concurrency:
      group: azure-testing
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: ${{ vars.AZURE_CONTAINER_APP }}
      REGISTRY_NAME: ${{ vars.AZURE_REGISTRY_NAME }}
      ENTRA_CLIENT_ID: ${{ vars.AZURE_ENTRA_CLIENT_ID }}
      TESTER_OBJECT_IDS_JSON: ${{ vars.AZURE_TESTER_OBJECT_IDS_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check required environment variables
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID RESOURCE_GROUP APP_NAME REGISTRY_NAME ENTRA_CLIENT_ID TESTER_OBJECT_IDS_JSON; do
            test -n "${!name}" || { echo "::error::Set $name in the azure-testing environment"; exit 1; }
          done
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Check authentication before publishing
        run: |
          set -euo pipefail
          app_id=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query id -o tsv)
          az rest --method get \
            --url "${app_id}/authConfigs/current?api-version=2024-03-01" > "$RUNNER_TEMP/auth.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ["RUNNER_TEMP"] + "/auth.json") as f:
              p = json.load(f)["properties"]
          aad = p["identityProviders"]["azureActiveDirectory"]
          assert p["platform"]["enabled"] is True, "Authentication must be enabled"
          assert p["globalValidation"]["unauthenticatedClientAction"] == "RedirectToLoginPage"
          assert p["globalValidation"]["redirectToProvider"] == "azureActiveDirectory"
          assert not p["globalValidation"].get("excludedPaths"), "No anonymous paths are permitted"
          assert aad["enabled"] is True
          assert aad["registration"]["clientId"] == os.environ["ENTRA_CLIENT_ID"]
          assert aad["registration"]["openIdIssuer"].rstrip("/") == (
              "https://login.microsoftonline.com/" + os.environ["AZURE_TENANT_ID"] + "/v2.0")
          principals = aad["validation"]["defaultAuthorizationPolicy"]["allowedPrincipals"]
          expected = json.loads(os.environ["TESTER_OBJECT_IDS_JSON"])
          assert isinstance(expected, list) and 1 <= len(expected) <= 12
          assert set(principals.get("identities", [])) == set(expected), "Tester allowlist has drifted"
          assert not principals.get("groups"), "Do not broaden the tester allowlist with groups"
          PY
      - name: Build and push the tested image
        run: |
          set -euo pipefail
          login_server=$(az acr show --name "$REGISTRY_NAME" --query loginServer -o tsv)
          image="$login_server/i-love-tabs:$GITHUB_SHA"
          docker build --target test --tag i-love-tabs:test .
          docker build --target production --tag "$image" .
          az acr login --name "$REGISTRY_NAME"
          docker push "$image"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "DEPLOY_IMAGE=$digest" >> "$GITHUB_ENV"
      - name: Update only the image and wait for its revision
        run: |
          set -euo pipefail
          az containerapp update --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" \
            --image "$DEPLOY_IMAGE" --output none
          revision=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" \
            --query properties.latestRevisionName -o tsv)
          echo "DEPLOY_REVISION=$revision" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            az containerapp revision show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" \
              --revision "$revision" --output json > "$RUNNER_TEMP/revision.json"
            if python3 - <<'PY'
          import json, os, sys
          with open(os.environ["RUNNER_TEMP"] + "/revision.json") as f:
              p = json.load(f)["properties"]
          images = [c["image"] for c in p["template"]["containers"]]
          sys.exit(0 if p.get("active") and p.get("provisioningState") == "Provisioned"
                   and p.get("healthState") == "Healthy" and os.environ["DEPLOY_IMAGE"] in images else 1)
          PY
            then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The new revision did not become healthy"
          exit 1
      - name: Verify public endpoint requires sign-in
        run: |
          set -euo pipefail
          fqdn=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" \
            --query properties.configuration.ingress.fqdn -o tsv)
          export APP_URL="https://$fqdn"
          python3 - <<'PY'
          import os, time, urllib.error, urllib.parse, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          url = os.environ["APP_URL"]
          for attempt in range(12):
              try:
                  response = opener.open(urllib.request.Request(url, headers={"Accept": "text/html"}), timeout=15)
              except urllib.error.HTTPError as error:
                  response = error
              except urllib.error.URLError:
                  time.sleep(5)
                  continue
              with response:
                  target = urllib.parse.urlparse(urllib.parse.urljoin(url, response.headers.get("Location", "")))
                  if response.code == 302 and target.netloc == urllib.parse.urlparse(url).netloc and target.path == "/.auth/login/aad":
                      print("Protected endpoint is available; anonymous visitors must sign in.")
                      break
                  if response.code == 200:
                      raise SystemExit("Unsafe deployment: homepage is anonymously accessible")
              time.sleep(5)
          else:
              raise SystemExit("Protected endpoint did not return the expected Entra login redirect")
          PY
          echo "Deployed $DEPLOY_IMAGE ($DEPLOY_REVISION) at $APP_URL" >> "$GITHUB_STEP_SUMMARY"
